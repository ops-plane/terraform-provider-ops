name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # vet, build, the generated docs current, and the acceptance tests: real Terraform against a real OPS (built
  # here, on Postgres: its master and the oldest release the provider supports) with a service token.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ops: [master, v0.12.0] # the newest and the oldest OPS it supports (the first with the ops-plane module path)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ops
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ops?sslmode=disable
      SECRET_KEY: ci-secret-key-for-the-acceptance-tests-only
      STATE_STORE: file:///tmp/state?create_dir=1&metadata=skip
      AUTH_DEV_USER: ci@localhost
      ADMIN_EMAILS: ci@localhost
      TEMPLATES_DIR: /tmp/catalog
      OPSPLANE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: go vet ./... && go build ./...
      - name: docs are generated from the current schema and examples
        run: go generate ./... && git diff --exit-code docs
      - name: OPS
        run: |
          # OPS itself direct (the module proxy caches what a branch name resolves to, so @master could be an older
          # commit); its dependencies through the proxy and checksum database, as go.sum expects them
          GOPRIVATE=github.com/ops-plane/ops go install github.com/ops-plane/ops/cmd/ops@${{ matrix.ops }}
          # a template with a per-environment input, for TestAccEnvironmentValue
          mkdir -p /tmp/catalog
          echo '{"id": "acc", "name": "Acc", "module": {"source": "git::https://example.com/m.git", "ref": "v1"}, "inputs": [
            {"name": "location", "type": "select", "options": ["westeurope", "northeurope"], "default": "westeurope", "per_environment": true}]}' > /tmp/catalog/acc.json
          nohup ops > /tmp/ops.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:8080/readyz && break; sleep 1; done
          token=$(openssl rand -hex 32)
          OPS_TOKEN=$token ops api-token -from-env OPS_TOKEN ci
          echo "::add-mask::$token"
          echo "OPSPLANE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: acceptance tests
        env:
          TF_ACC: "1"
          OPSPLANE_ACC_TEMPLATE_ID: acc
          OPSPLANE_ACC_INPUT: location
          OPSPLANE_ACC_VALUES: westeurope,northeurope
        run: go test -count=1 -timeout 15m -v ./...
      - if: failure()
        run: tail -50 /tmp/ops.log
