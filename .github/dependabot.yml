# Update PRs for Go modules and pinned actions. The cooldown waits a week after a release before proposing
# it: most compromised package versions are caught and pulled within days.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "fix(deps)" }
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]
